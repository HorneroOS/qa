id: wallpapers/unconfigured-empty-state
purpose: >-
  A fresh profile with no wallpaper uses the intentional choose-wallpaper
  empty state instead of trying to render a CLI diagnostic as an image.
covers: [shell#133]
setup:
  layout: hornero-left
  # This changes only the throwaway guest overlay, then restarts Quickshell
  # so the service resolves a genuinely unconfigured profile on startup.
  commands:
    - 'rm -f "$HOME/.local/state/hornero/wallpaper/path"'
    - 'rm -f "$HOME/.local/state/dots/wallpaper/path"'
    - 'rm -f "$HOME/.cache/wal/wal"'
    - 'pkill -x qs || true; sleep 2'
    - 'setsid -f nohup "$HOME/.local/bin/qa-shell.sh" >/dev/null 2>&1 < /dev/null'
    - 'for _ in $(seq 1 60); do qs ipc call drawers list >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
instruction: Open the desktop with no wallpaper selected and inspect the background prompt.
steps:
  - probe: {run: "qs ipc call wallpaper get", equals: "", retry_s: 3}
  - screenshot: empty-wallpaper-state
proof:
  - probe: {run: "pgrep -a qs", contains: qs}
budget: {wall_s: 90}
artifacts: {screenshots: always, logs: always}
