id: recovery/doctor-honesty
purpose: >-
  OS recovery readiness is reported, never invented: recovery doctor
  probes the shipped snapshot backend, root filesystem, the
  top-level /.snapshots store, snapper/config presence and retention
  timers read-only. While no backend is VM-proven it must keep
  reporting snapshot_backend=none, fail its backend check, and state
  that config snapshots are not OS rollback. A non-Btrfs root is
  plainly unsupported. No restore or create verb exists.
covers: [hornero#179, qa#19]
instruction: >-
  On an installed HorneroOS system, open a terminal and inspect the
  recovery doctor reporting without changing anything.
proof:
  - note: Doctor JSON exposes the machine-readable backend contract
    probe: {run: "horneroctl recovery doctor --json | python3 -c \"import json,sys;d=json.load(sys.stdin)['data'];print('snapshot_backend' in d and 'root_fstype' in d and 'snapshots_store' in d)\"", equals: "True"}
  - note: Backend check agrees with the reported backend (none fails, never ok)
    probe: {run: "horneroctl recovery doctor --json | python3 -c \"import json,sys;d=json.load(sys.stdin)['data'];print((d['snapshot_backend']=='none') == (d['snapshot-backend']=='fail'))\"", equals: "True"}
  - note: Human output keeps config snapshots separate from OS rollback
    probe: {run: "horneroctl recovery doctor | grep -ci 'not OS rollback'; true", equals: "1"}
  - note: No decorative restore/create verb is exposed before VM proof
    probe: {run: "horneroctl recovery restore >/dev/null 2>&1; echo $?; horneroctl recovery create >/dev/null 2>&1; echo $?", equals: "2\n2"}
  - note: Root filesystem probe matches the installed system
    probe: {run: "horneroctl recovery doctor --json | python3 -c \"import json,sys;d=json.load(sys.stdin)['data'];fs=[l.split()[2] for l in open('/proc/mounts') if l.split()[1]=='/'][0];print(d['root_fstype']==fs)\"", equals: "True"}
budget: {wall_s: 60}
artifacts: {screenshots: on-failure, logs: on-failure}
