id: studio/jobs-approval-privacy
purpose: >-
  Studio render jobs require explicit submission through allow-listed
  adapters only: unknown adapters and missing inputs are refused, a
  queued job can be cancelled by explicit action, cancellation never
  creates or deletes output, and no background execution happens.
covers: [qa#27, hornero#289, shell#316]
instruction: Open a terminal and review Studio render jobs without submitting anything.
proof:
  - note: A fresh system records no Studio jobs
    probe: {run: "horneroctl studio jobs list", contains: "No Studio jobs recorded yet"}
  - note: Unknown adapters are refused (no arbitrary executables)
    probe: {run: "printf qa > /tmp/qa-studio-in.mov && horneroctl studio jobs submit --adapter vlc --input /tmp/qa-studio-in.mov --output /tmp/qa-studio-out.mp4 >/dev/null 2>&1 && echo allowed || echo refused", equals: refused}
  - note: Missing inputs are refused before any job is recorded
    probe: {run: "horneroctl studio jobs submit --adapter ffmpeg-export --input /tmp/qa-missing-in.mov --output /tmp/qa-studio-out.mp4 >/dev/null 2>&1 && echo allowed || echo refused", equals: refused}
  - note: Refusals record no job and create no output
    probe: {run: "horneroctl studio jobs list", contains: "No Studio jobs recorded yet"}
  - note: Job ids cannot traverse out of the user job store
    probe: {run: "horneroctl studio jobs status ../selection >/dev/null 2>&1 && echo allowed || echo refused", equals: refused}
budget: {wall_s: 60}
artifacts: {screenshots: on-failure, logs: on-failure}
