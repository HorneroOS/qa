id: studio/audio-mode-opt-in
purpose: >-
  Studio audio modes stay safe by default: Balanced is the recorded
  default, Low Latency refuses without explicit opt-in, and restore with
  nothing recorded is a harmless no-op (HorneroOS/hornero#287 contract).
covers: [qa#21, hornero#287, hornero#286]
instruction: Open a terminal and inspect the Studio mode state without changing anything.
proof:
  - note: Default audio mode is Balanced (device defaults, no forced quantum)
    probe: {run: "horneroctl studio mode", contains: "Studio audio mode: balanced"}
  - note: Temporary Performance starts inactive
    probe: {run: "horneroctl studio mode", contains: "Temporary Performance: inactive"}
  - note: Low Latency refuses without the explicit opt-in flag
    probe: {run: "horneroctl studio mode audio low-latency >/dev/null 2>&1 && echo allowed || echo refused", equals: refused}
  - note: Restore with no recorded previous mode changes nothing
    probe: {run: "horneroctl studio mode restore", contains: "Nothing to restore"}
  - note: Mode state is still Balanced after the refused change
    probe: {run: "horneroctl studio mode", contains: "Studio audio mode: balanced"}
budget: {wall_s: 60}
artifacts: {screenshots: on-failure, logs: on-failure}
