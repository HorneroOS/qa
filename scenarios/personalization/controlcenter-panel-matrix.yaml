id: personalization/controlcenter-panel-matrix
purpose: Capture every Control Center destination at the same desktop size for visual review.
covers: [shell#209]
requires:
  compositor: hyprland
  outputs: 1
  resolution: 1280x800
instruction: >-
  Open Settings, then use Find a setting to visit every destination. Pause on
  each page so its first view can be reviewed as a consistent visual set.
steps:
  - key: ctrl+space
  - wait: {changed: true, stable: 0.4, timeout: 8}
  - type: ">Settings"
  - wait: {stable: 0.4, timeout: 8}
  - key: enter
  - probe:
      run: 'hyprctl activewindow -j | jq -r ''.title // ""'''
      contains: "Hornero Settings - "
      retry_s: 10
  - key: ctrl+,
  - wait: {changed: true, stable: 0.3, timeout: 5}
  - type: Network
  - wait: {stable: 0.3, timeout: 5}
  - key: enter
  - wait: {stable: 0.7, timeout: 8}
  - probe:
      run: 'hyprctl activewindow -j | jq -r ''.title // ""'''
      equals: Hornero Settings - Network
      retry_s: 8
  - screenshot: controlcenter-network
  - key: ctrl+,
  - wait: {changed: true, stable: 0.3, timeout: 5}
  - type: Bluetooth
  - wait: {stable: 0.3, timeout: 5}
  - key: enter
  - wait: {stable: 0.7, timeout: 8}
  - probe:
      run: 'hyprctl activewindow -j | jq -r ''.title // ""'''
      equals: Hornero Settings - Bluetooth
      retry_s: 8
