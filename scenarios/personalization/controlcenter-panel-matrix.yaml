proof:
  - note: The complete Control Center route matrix was reached through the Settings search interface.
    probe:
      run: 'hyprctl clients -j | jq -r ''[.[] | select(.title == "Hornero Settings - Network")] | length'''
      equals: "1"
  - note: The Shell remains alive after visiting the full panel set.
    probe: {run: "pgrep -x qs || pgrep -x quickshell"}
  - screenshot: final
media:
  - controlcenter-network
  - controlcenter-bluetooth
  - controlcenter-vpn
  - controlcenter-appearance
  - controlcenter-bars
  - controlcenter-layout
  - controlcenter-launcher
  - controlcenter-dashboard
  - controlcenter-javi
  - controlcenter-audio
  - controlcenter-notifications
  - controlcenter-osd
  - controlcenter-system
  - controlcenter-updates
  - controlcenter-terminal
  - controlcenter-power
budget: {wall_s: 360, max_actions: 150}
artifacts: {screenshots: always, logs: on-failure}
