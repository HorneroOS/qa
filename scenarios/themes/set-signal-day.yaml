id: themes/set-signal-day
purpose: >-
  Switching the official theme to Hornero Signal Day applies natively and the
  active-theme query agrees afterwards.
setup:
  theme: hornero-signal-day
instruction: Switch the desktop theme to Hornero Signal Day and look at the result.
proof:
  - note: The active official theme is Hornero Signal Day
    probe: {run: "horneroctl appearance theme get", contains: hornero-signal-day, retry_s: 10}
  - screenshot: hornero-signal-day
media: [hornero-signal-day]
budget: {wall_s: 120}
