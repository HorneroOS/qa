id: themes/package-only-flagships
purpose: >-
  Installed Hornero theme packs apply without a user or dotfiles theme
  catalogue, including Signal Day and Pampa with matching GTK and icons.
instruction: >-
  Search for Hornero Signal Day in the launcher and apply it. Then search for
  Pampa and apply it. Inspect both results and return to Hornero Signal Day.
requires:
  resolution: 1280x800
setup:
  commands:
    - >-
      rm -rf "$HOME/.local/share/hornero/themes"
      "$HOME/.local/share/hornero/wallpapers"
      "$HOME/.local/share/dots/themes"
      "$HOME/.local/share/dots/wallpapers"
steps:
  - probe:
      run: "test ! -e \"$HOME/.local/share/hornero/themes\" && test ! -e \"$HOME/.local/share/dots/themes\" && test ! -e \"$HOME/.local/share/hornero/wallpapers\" && test ! -e \"$HOME/.local/share/dots/wallpapers\" && echo no-user-catalogue"
      equals: "no-user-catalogue"
  - probe:
      run: "horneroctl appearance theme list --full --json | jq -er '.message | fromjson | any(.[]; .id == \"hornero-signal-day\") and any(.[]; .id == \"pampa\")'"
      equals: "true"
  - key: ctrl+space
  - wait: {changed: true, stable: 0.4, timeout: 8}
  - probe:
      run: "qs ipc call drawers state launcher"
      equals: "true"
      retry_s: 3
  - type: ">theme Hornero Signal Day"
  - wait: {changed: true, stable: 0.5, timeout: 8}
  - screenshot: package-only-hornero-signal-day-search
  - key: enter
  - probe:
      run: "horneroctl appearance theme get"
      contains: "hornero-signal-day"
      retry_s: 20
  - screenshot: package-only-hornero-signal-day
  - key: ctrl+space
  - wait: {changed: true, stable: 0.4, timeout: 8}
  - probe:
      run: "qs ipc call drawers state launcher"
      equals: "true"
      retry_s: 3
  - type: ">theme Pampa"
  - wait: {changed: true, stable: 0.5, timeout: 8}
  - screenshot: package-only-pampa-search
  - key: enter
  - probe:
      run: "horneroctl appearance theme get"
      contains: "pampa"
      retry_s: 30
  - screenshot: package-only-pampa
  - probe:
      run: "horneroctl --json appearance theme get | jq -er '[.data.id,.data.mode,.data.gtk_theme,.data.icon_theme,.data.gtk_color_scheme] | join(\"|\")'"
      equals: "pampa|dark|Hornero-Pampa|Papirus-Dark|prefer-dark"
      retry_s: 10
  - probe:
      run: "horneroctl wallpaper current"
      contains: "/usr/share/hornero/wallpapers/pampa/pampa-01.jpg"
  - key: ctrl+space
  - wait: {changed: true, stable: 0.4, timeout: 8}
  - probe:
      run: "qs ipc call drawers state launcher"
      equals: "true"
      retry_s: 3
  - type: ">theme Hornero Signal Day"
  - wait: {changed: true, stable: 0.5, timeout: 8}
  - key: enter
  - probe:
      run: "horneroctl appearance theme get"
      contains: "hornero-signal-day"
      retry_s: 20
proof:
  - note: No personal or legacy user theme or wallpaper catalogue was present.
    probe: {run: "test ! -e \"$HOME/.local/share/hornero/themes\" && test ! -e \"$HOME/.local/share/dots/themes\" && test ! -e \"$HOME/.local/share/hornero/wallpapers\" && test ! -e \"$HOME/.local/share/dots/wallpapers\" && echo clean", equals: "clean"}
  - note: Installed system catalogue provides both flagship theme packs.
    probe: {run: "horneroctl appearance theme list --full --json | jq -er '.message | fromjson | any(.[]; .id == \"hornero-signal-day\") and any(.[]; .id == \"pampa\")'", equals: "true"}
  - note: Final appearance is Hornero Signal Day with its GTK color policy and icons.
    probe: {run: "horneroctl --json appearance theme get | jq -er '[.data.id,.data.mode,.data.gtk_theme,.data.icon_theme,.data.gtk_color_scheme] | join(\"|\")'", equals: "hornero-signal-day|light|Hornero-Signal-Day|Papirus|prefer-light"}
  - note: Shell remains alive after repeated system-pack transitions.
    probe: {run: "pgrep -x qs || pgrep -x quickshell"}
  - screenshot: final
media: [package-only-hornero-signal-day, package-only-pampa]
budget: {wall_s: 360, max_actions: 50}
artifacts: {screenshots: always, logs: on-failure}
