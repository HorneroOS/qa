id: install-pairwise/gaming-dual-primary-lts-systemd-boot-uefi-luks-bt-off
purpose: 'NOT RUN until a candidate ISO exists. A gaming installation (kernels linux-lts,
  linux; primary linux-lts; systemd-boot on uefi; encryption luks; bluetooth disabled)
  from the candidate ISO, rebooted into the installed system, matches the canonical
  resolved choice: kernel and initramfs images, boot entries, ESP size, LUKS state,
  edition composition and capability services. This never qualifies physical hardware.'
covers:
- installer#11
- qa#19
requires:
  firmware: uefi
  bootloader: systemd-boot
  kernels:
  - linux-lts
  - linux
  primaryKernel: linux-lts
  encryption: luks
  edition: gaming
  specializations: []
  capabilities:
    bluetooth: false
  isoRequired: true
instruction: Using the existing VM harness (~/.local/share/hornero/install-test/run-install-vm.sh
  <name> uefi 40 iso), boot the candidate ISO in a disposable VM, launch the graphical
  installer, choose edition gaming, kernels linux-lts, linux (primary linux-lts),
  bootloader systemd-boot, encryption luks, bluetooth disabled; create the QA user,
  let installation finish, reboot with the ISO detached (run-install-vm.sh <name>
  uefi 40 noiso), unlock LUKS if prompted and authenticate at the greeter. On the
  reboot into the installed system, choose the linux-lts boot entry. Then reboot once
  more into the installed system and leave the installed desktop running for the proofs.
proof:
- note: Installed Hyprland session is running after authenticating at the greeter
  probe:
    run: pgrep -x Hyprland >/dev/null && echo up
    equals: up
- note: Installed profile metadata names the installed edition
  probe:
    run: python3 -c "import json;print(json.load(open('/usr/lib/hornero/system-profile.json'))['edition']['edition'])"
    equals: gaming
- note: horneroctl system info agrees with the installed profile
  probe:
    run: horneroctl system info --json | python3 -c "import json,sys;print(json.load(sys.stdin)['data']['edition'])"
    equals: gaming
- note: Installer package repository removed from pacman.conf (cleanup contract)
  probe:
    run: grep -c hornero-installer /etc/pacman.conf; true
    equals: '0'
- note: Firmware of the installed boot matches the declared firmware
  probe:
    run: '[ -d /sys/firmware/efi ] && echo uefi || echo bios'
    equals: uefi
- note: Kernel linux-lts image, initramfs, fallback initramfs and headers are installed
  probe:
    run: test -f /boot/vmlinuz-linux-lts && test -f /boot/initramfs-linux-lts.img
      && test -f /boot/initramfs-linux-lts-fallback.img && pacman -Qq linux-lts linux-lts-headers
      >/dev/null && echo ok
    equals: ok
- note: Kernel linux image, initramfs, fallback initramfs and headers are installed
  probe:
    run: test -f /boot/vmlinuz-linux && test -f /boot/initramfs-linux.img && test
      -f /boot/initramfs-linux-fallback.img && pacman -Qq linux linux-headers >/dev/null
      && echo ok
    equals: ok
- note: Running kernel is the LTS primary/fallback
  probe:
    run: uname -r
    contains: lts
- note: systemd-boot loader and an entry covering every installed kernel exist
  probe:
    run: test -f /boot/loader/loader.conf && grep -rq vmlinuz-linux-lts /boot/loader/entries/
      && grep -rq vmlinuz-linux /boot/loader/entries/ && echo ok
    equals: ok
- note: ESP at /boot is vfat and at least the resolver-recommended 1280 MiB
  probe:
    run: python3 -c "import os; s=os.statvfs('/boot'); print('ok' if s.f_blocks*s.f_frsize
      >= 1280*1024*1024 else 'small')"
    equals: ok
- note: Root storage is LUKS with a crypttab entry (LUKS/openswap contract preserved)
  probe:
    run: lsblk -o FSTYPE -rn | grep -q crypto_LUKS && grep -q . /etc/crypttab && echo
      ok
    equals: ok
- note: 'Bluetooth capability off: bluez stack absent and bluetooth.service not enabled'
  probe:
    run: pacman -Qq bluez bluez-utils >/dev/null 2>&1 && echo present || echo absent
    equals: absent
- note: Gaming platform tools from the canonical composition are installed
  probe:
    run: pacman -Qq gamescope gamemode mangohud >/dev/null && echo present || echo
      absent
    equals: present
- note: Steam was not installed by group selection (explicit opt-in only)
  probe:
    run: pacman -Qq steam >/dev/null 2>&1 && echo present || echo absent
    equals: absent
- note: Desktop frame (non-blank) for the record
  screenshot: installed-desktop
media:
- installed-desktop
budget:
  wall_s: 3600
artifacts:
  screenshots: always
  logs: always
