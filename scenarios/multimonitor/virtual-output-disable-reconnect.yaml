id: multimonitor/virtual-output-disable-reconnect
covers: [qa#25]
purpose: >-
  On a disposable two-output guest, simulate a compositor-level output removal
  and reconnection, and verify a synthetic critical window remains recoverable
  through workspace navigation and visible after both transitions.
requires: {outputs: 2, compositor: hyprland}
setup:
  layout: cockpit-clear
  commands:
    - >-
      hyprctl monitors all -j | jq -e '([.[] | select(.name == "Virtual-1")] | length == 1) and
      ([.[] | select(.name == "Virtual-2")] | length == 1)'
    - command -v kitty
    - hyprctl dispatch focusmonitor Virtual-2
    - hyprctl monitors -j | jq -e 'any(.[]; .name == "Virtual-2" and .focused == true)'
    - >-
      setsid -f kitty --title 'Hornero QA Critical Window' sleep 600
      >/tmp/hornero-qa-critical-window.log 2>&1
    - |
      for _ in $(seq 1 20); do
        [ "$(hyprctl clients -j | jq '[.[] | select(.title == "Hornero QA Critical Window")] | length')" = 1 ] && exit 0
        sleep 0.5
      done
      exit 1
    - >-
      jq -n --argjson monitors "$(hyprctl monitors -j)" --argjson clients "$(hyprctl clients -j)"
      '[$monitors[] | {monitor: .id, workspace: .activeWorkspace.id}] as $active |
      [$clients[] as $client |
      select($client.title == "Hornero QA Critical Window" and $client.monitor ==
      ($monitors[] | select(.name == "Virtual-2") | .id) and $client.mapped == true and
      ($client.hidden // false) == false) |
      select(any($active[]; .monitor == $client.monitor and .workspace == $client.workspace.id))] | length'
      | grep -qx 1
    - >-
      printf '%s\n' '#!/bin/sh' 'hyprctl keyword monitor "Virtual-2,disable"
      >/tmp/hornero-qa-display-off.result 2>&1'
      >/tmp/hornero-qa-display-off
    - chmod 700 /tmp/hornero-qa-display-off
    - hyprctl keyword bind 'CTRL ALT, Z, exec, sh /tmp/hornero-qa-display-off'
    - >-
      printf '%s\n' '#!/bin/sh'
      'hyprctl keyword monitor "Virtual-2,1280x800@60,1280x0,1"'
      >/tmp/hornero-qa-display-on
    - chmod 700 /tmp/hornero-qa-display-on
    - hyprctl keyword bind 'CTRL ALT, X, exec, sh /tmp/hornero-qa-display-on'
    - >-
      hyprctl binds -j | jq -e 'any(.[]; .key == "Z") and any(.[]; .key == "X")'
instruction: Disable Virtual-2, switch to the preserved critical-window workspace on the remaining output, then reconnect Virtual-2.
steps:
  - probe:
      run: hyprctl version
      save: compositor-version.txt
  - probe:
      run: kitty --version
      save: window-client-version.txt
  - screenshot: before-output-disable
  - key: ctrl+alt+z
  - probe:
      run: "hyprctl binds -j | jq -c '[.[] | select(.key == \"Z\" or .key == \"X\")]'"
      contains: Z
      retry_s: 5
      save: registered-output-binds.json
  - probe:
      run: cat /tmp/hornero-qa-display-off.result
      contains: ok
      retry_s: 5
      save: display-off-command.txt
  - probe:
      run: "hyprctl monitors -j | jq length"
      equals: "1"
      retry_s: 10
      save: disconnected-monitors.json
  - probe:
      run: >-
        jq -n --argjson monitors "$(hyprctl monitors -j)"
        --argjson workspaces "$(hyprctl workspaces -j)"
        --argjson clients "$(hyprctl clients -j)"
        '{monitors: [$monitors[] | {id, name, activeWorkspace}],
        workspaces: [$workspaces[] | {id, name, monitor, windows}],
        critical_window: [$clients[] | select(.title == "Hornero QA Critical Window") |
        {address, mapped, hidden, monitor, workspace}]}'
      save: disconnected-window-state.json
  - probe:
      run: >-
        jq -n --argjson monitors "$(hyprctl monitors -j)" --argjson clients "$(hyprctl clients -j)"
        '[$monitors[] | .id] as $active_monitors |
        [$clients[] as $client |
        select($client.title == "Hornero QA Critical Window" and $client.mapped == true and
        ($active_monitors | index($client.monitor) != null))] | length'
      equals: "1"
      retry_s: 5
      save: disconnected-window-preserved.json
  - key: super+2
  - probe:
      run: >-
        jq -n --argjson monitors "$(hyprctl monitors -j)"
        --argjson workspaces "$(hyprctl workspaces -j)"
        --argjson clients "$(hyprctl clients -j)"
        '{monitors: [$monitors[] | {id, name, activeWorkspace}],
        workspaces: [$workspaces[] | {id, name, monitor, windows}],
        critical_window: [$clients[] | select(.title == "Hornero QA Critical Window") |
        {address, mapped, hidden, monitor, workspace}]}'
      save: disconnected-window-visible-state.json
  - probe:
      run: >-
        jq -n --argjson monitors "$(hyprctl monitors -j)" --argjson clients "$(hyprctl clients -j)"
        '[$monitors[] | {monitor: .id, workspace: .activeWorkspace.id}] as $active |
        [$clients[] as $client |
        select($client.title == "Hornero QA Critical Window" and $client.mapped == true and
        ($client.hidden // false) == false) |
        select(any($active[]; .monitor == $client.monitor and .workspace == $client.workspace.id))] | length'
      equals: "1"
      retry_s: 5
      save: disconnected-window-on-active-output.json
  - screenshot: critical-window-visible-on-remaining-output
  - key: ctrl+alt+x
  - note: Allow the re-enabled virtual head to repaint before the final capture.
  - pause: 3
proof:
  - note: Both named virtual outputs are enabled after reconnect
    probe:
      run: >-
        hyprctl monitors -j | jq -e '([.[] | select(.name == "Virtual-1")] | length == 1) and
        ([.[] | select(.name == "Virtual-2")] | length == 1)'
      equals: "true"
      retry_s: 10
  - note: Record active monitor/workspace and critical-window state after reconnect
    probe:
      run: >-
        jq -n --argjson monitors "$(hyprctl monitors -j)"
        --argjson workspaces "$(hyprctl workspaces -j)"
        --argjson clients "$(hyprctl clients -j)"
        '{monitors: [$monitors[] | {id, name, activeWorkspace}],
        workspaces: [$workspaces[] | {id, name, monitor, windows}],
        critical_window: [$clients[] | select(.title == "Hornero QA Critical Window") |
        {address, mapped, hidden, monitor, workspace}]}'
      save: reconnected-window-state.json
  - note: The synthetic critical window remains visible on an active workspace
    probe:
      run: >-
        jq -n --argjson monitors "$(hyprctl monitors -j)" --argjson clients "$(hyprctl clients -j)"
        '[$monitors[] | {monitor: .id, workspace: .activeWorkspace.id}] as $active |
        [$clients[] as $client |
        select($client.title == "Hornero QA Critical Window" and $client.mapped == true and
        ($client.hidden // false) == false) |
        select(any($active[]; .monitor == $client.monitor and .workspace == $client.workspace.id))] | length'
      equals: "1"
      retry_s: 5
  - screenshot: reconnected-desktop
budget: {wall_s: 150}
artifacts: {screenshots: always, logs: always}
