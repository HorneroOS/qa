id: multimonitor/mixed-dpi-two-outputs
purpose: >-
  Verify the two-output desktop stays usable when its virtual outputs use different
  display scales: Hyprland reports both scales, the active layout draws bars on
  both outputs, and both output captures contain desktop content.
covers: [qa#25]
requires: {outputs: 2, compositor: hyprland}
setup:
  layout: cockpit-clear
  commands:
    - >-
      hyprctl monitors all -j | jq -e '([.[] | select(.name == "Virtual-1")] | length == 1) and
      ([.[] | select(.name == "Virtual-2")] | length == 1)'
    - hyprctl keyword monitor "Virtual-1,1280x800@60,0x0,1"
    - hyprctl keyword monitor "Virtual-2,1920x1080@60,1280x0,1.5"
instruction: Start the desktop with two differently scaled virtual outputs and inspect each screen.
proof:
  - note: Hyprland version is recorded with the output-scale result
    probe: {run: "hyprctl version", contains: "Hyprland", retry_s: 10}
  - note: Hyprland reports Virtual-1 at scale 1 and Virtual-2 at scale 1.5
    probe:
      run: "hyprctl monitors -j | jq -c '[.[] | {name,scale}] | sort_by(.name)'"
      equals: '[{"name":"Virtual-1","scale":1},{"name":"Virtual-2","scale":1.5}]'
      retry_s: 10
  - note: Cockpit Clear has two visible bars on each output
    probe:
      run: "qs ipc call debug bars | jq -c '[.[] | select(.visible)] | group_by(.screen) | map(length) | sort'"
      equals: '[2,2]'
      retry_s: 10
  - screenshot: mixed-scale-outputs
budget: {wall_s: 120}
artifacts: {screenshots: always, logs: on-failure}
