id: bars/dock-bottom-popout-travel
purpose: >-
  Moving the pointer from a bottom-dock status trigger into its popout must
  keep the card open across the gap and preserve focus in the active app.
covers: [shell#98, shell#127]
requires:
  resolution: 1280x800
setup:
  layout: dock-bottom
instruction: Open Bluetooth from the bottom dock and move the pointer into its card.
steps:
  - key: ctrl+space
  - type: kitty
  - key: enter
  - probe: {run: "hyprctl activewindow -j | jq -r .class", equals: kitty, retry_s: 10}
  - pointer: {x: 0.713, y: 0.948, glide: 8}
  - probe: {run: "qs ipc call debug dump | jq -r .popout.name", equals: bluetooth, retry_s: 6}
  - probe:
      run: >-
        qs ipc call debug dump | jq -r '.panels[] | select(.name == "popouts") |
        (.visible == true and .width > 0 and .height > 0)'
      equals: "true"
      retry_s: 3
  - screenshot: dock-popout-open
  - pointer: {x: 0.713, y: 0.70, glide: 12}
  - probe: {run: "qs ipc call debug dump | jq -r .popout.name", equals: bluetooth, retry_s: 3}
  - probe: {run: "hyprctl activewindow -j | jq -r .class", equals: kitty}
proof:
  - note: The status popout stays open after the pointer travels into its card.
    probe: {run: "qs ipc call debug dump | jq -r .popout.name", equals: bluetooth}
  - note: Hovering keeps keyboard focus in the active application.
    probe: {run: "hyprctl activewindow -j | jq -r .class", equals: kitty}
  - screenshot: pointer-inside-popout
budget: {wall_s: 100}
