id: gaming/recovery-readiness
purpose: >-
  Graphics-sensitive updates stay on the existing HorneroOS
  update/snapshot path: gaming doctor probes recovery readiness
  (LTS fallback kernel or snapshot tool) and reports it honestly —
  when no recovery path exists it says so with actionable guidance,
  and it never asserts a recovery path that is not present. No
  Gaming-only snapshot framework is created.
covers: [qa#39, hornero#328]
instruction: >-
  On an installed Gaming system, open a terminal and inspect the
  gaming doctor recovery reporting without changing anything.
proof:
  - note: Doctor JSON exposes the recovery-readiness capability check
    probe: {run: "horneroctl gaming doctor --json | python3 -c \"import json,sys;print('recovery-readiness' in json.load(sys.stdin)['data'])\"", equals: "True"}
  - note: Absent recovery path is reported fail, never asserted present
    probe: {run: "horneroctl gaming doctor --json | python3 -c \"import json,sys,os;d=json.load(sys.stdin)['data'];present=os.path.exists('/boot/vmlinuz-linux-lts') or os.path.exists('/boot/vmlinuz-linux-lts-fallback');print(d['recovery-readiness']=='ok' if present else d['recovery-readiness']=='fail')\"", equals: "True"}
  - note: Doctor never claims hardware qualification in its human output
    probe: {run: "horneroctl gaming doctor | grep -ci qualified; true", equals: "0"}
budget: {wall_s: 60}
artifacts: {screenshots: on-failure, logs: on-failure}
