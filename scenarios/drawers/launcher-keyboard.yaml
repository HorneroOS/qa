id: drawers/launcher-keyboard
purpose: >-
  CTRL+Space opens the app launcher through `horneroctl apps launch`, typed
  text reaches its search field, and Escape closes it.
instruction: Press Ctrl+Space, type "term", look at the results, then press Escape.
steps:
  - key: ctrl+space
  - wait: {changed: true, stable: 0.5, timeout: 5}
  - probe: {run: "qs ipc call drawers state launcher", equals: "true", retry_s: 3}
  - type: term
  - wait: {changed: true, stable: 0.5, timeout: 5}
  - screenshot: launcher-search
  - key: escape
  - wait: {changed: true, stable: 0.5, timeout: 5}
proof:
  - note: Escape closed the launcher
    probe: {run: "qs ipc call drawers state launcher", equals: "false", retry_s: 3}
  - screenshot: after-escape
media: [launcher-search]
budget: {wall_s: 60}
