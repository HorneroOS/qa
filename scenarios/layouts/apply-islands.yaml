id: layouts/apply-islands
purpose: >-
  Islands: floating top bar split into islands. Applying the preset must switch the active preset and leave
  exactly the declared bar edges visible.
covers: [shell#88, shell#90]
setup:
  layout: islands
instruction: Switch the desktop layout to islands and look at the result.
proof:
  - note: The active preset pointer names the applied preset
    probe: {run: "horneroctl shell preset current", contains: islands}
  - note: Visible bar edges match the preset declaration
    probe:
      run: "qs ipc call debug bars | jq -c '[.[] | select(.visible) | .edge] | unique'"
      equals: '["top"]'
      retry_s: 10
  - note: The layout as a user sees it
    screenshot: layout-islands
media: [layout-islands]
budget: {wall_s: 90}
