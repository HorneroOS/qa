id: layouts/apply-cockpit-clear
purpose: >-
  Cockpit Clear: transparent top and bottom bars. Applying the preset must switch the active preset and leave
  exactly the declared bar edges visible.
covers: [shell#88, shell#92, shell#94]
setup:
  layout: cockpit-clear
instruction: Switch the desktop layout to cockpit-clear and look at the result.
proof:
  - note: The active preset pointer names the applied preset
    probe: {run: "horneroctl shell preset current", contains: cockpit-clear}
  - note: Visible bar edges match the preset declaration
    probe:
      run: "qs ipc call debug bars | jq -c '[.[] | select(.visible) | .edge] | unique'"
      equals: '["bottom","top"]'
      retry_s: 10
  - note: The layout as a user sees it
    screenshot: layout-cockpit-clear
media: [layout-cockpit-clear]
budget: {wall_s: 90}
