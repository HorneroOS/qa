id: layouts/gallery-cockpit-clear-day
purpose: >-
  cockpit-clear on Signal Day (light) to judge ink, rules and segment contrast on paper.
covers: [shell#484, shell#490, shell#494]
requires:
  resolution: 1280x800
  compositor: hyprland
setup:
  layout: cockpit-clear
  theme: hornero-signal-day
  commands:
    - qs ipc call experience set everyday
    - sleep 5
instruction: Look at the desktop and judge it against the Signal Bezel visual language and its concept specimens.
steps:
  - wait: {stable: 1.5, timeout: 10}
  - pointer: {x: 0.5, y: 0.5}
  - wait: {stable: 1.0, timeout: 6}
  - screenshot: cockpit-clear-day
proof:
  - note: At least one bar is visible and the geometry is recorded for review
    probe: {run: "qs ipc call debug bars | jq -c '[.[] | select(.visible) | {edge,style,geom}]'", matches: "edge", save: bars.json, retry_s: 12}
  - note: No QML errors
    probe: {run: "grep -Ec 'TypeError|ReferenceError|Cannot assign|QML.*Error' /tmp/qs.log || true", equals: "0"}
  - screenshot: final

media: [cockpit-clear-day]
budget: {wall_s: 100}
artifacts: {screenshots: always, logs: always}
