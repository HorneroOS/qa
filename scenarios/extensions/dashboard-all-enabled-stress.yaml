id: extensions/dashboard-all-enabled-stress
purpose: >-
  All-dashboard-extensions-enabled stress (qa#81): with every fixture
  dashboard extension enabled at once, the dashboard opens responsively,
  every card's extension reports loaded, and the shell stays responsive to
  IPC and Escape. Card layout quality (grouping, wide/compact spans) is
  screenshot-review evidence. PENDING until run in an approved KVM window.
covers: [qa#81, shell#378]
instruction: Open the dashboard with every dashboard extension enabled and look at all the cards.
steps:
  - probe: {run: "qs ipc call plugins status | jq -r '[.plugins[] | select(.enabled and .installed)] | length >= 3'", equals: "true", retry_s: 15}
  - key: super+d
  - wait: {changed: true, stable: 0.5, timeout: 10}
  - probe: {run: "qs ipc call drawers state dashboard", equals: "true", retry_s: 5}
  - screenshot: dashboard-all-extensions
  - scroll: 3
  - wait: {stable: 0.5, timeout: 8}
  - screenshot: dashboard-all-extensions-scrolled
  - key: escape
  - wait: {changed: true, stable: 0.5, timeout: 5}
proof:
  - note: Every enabled fixture extension is loaded under the all-enabled load and none failed
    probe: {run: "qs ipc call plugins status | jq -r '\"\\(.loaded) \\(.failed) \\([.plugins[] | select(.enabled and .installed)] | length)\"'", matches: "^([1-9][0-9]*) 0 \\1$", retry_s: 10}
  - note: No extension is flagged for load churn under the stress
    probe: {run: "qs ipc call plugins status | jq -r '[.plugins[] | select(.diagnostics != null) | .diagnostics[]? | select(. == \"load-churn\" or .kind == \"load-churn\")] | length'", equals: "0"}
  - note: Escape closed the dashboard (the shell stayed responsive)
    probe: {run: "qs ipc call drawers state dashboard", equals: "false", retry_s: 3}
  - note: Quickshell remains alive
    probe: {run: "pgrep -x qs || pgrep -x quickshell"}
  - screenshot: after-escape
media: [dashboard-all-extensions]
budget: {wall_s: 180}
artifacts: {screenshots: always, logs: always}
