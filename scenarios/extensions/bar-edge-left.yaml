id: extensions/bar-edge-left
purpose: >-
  Bar edges (qa#81), left rail: a bar extension renders compactly on the
  vertical left rail (host context vertical/compact), and its host-owned
  tooltip and popover open inward without clipping. Tooltip/popover
  placement is manual screenshot-review evidence: the note steps are the
  reviewer's journey in the KVM window, and the deterministic run alone
  must not be recorded as visual PASS. PENDING until run.
covers: [qa#81, shell#370, shell#371, shell#372]
requires: {resolution: 1280x800}
setup:
  layout: hornero-left
instruction: Look at the bar extension on the left rail, then hover or focus it for its tooltip and open its popover if it has one.
steps:
  - probe: {run: "qs ipc call plugins status | jq -r .discovered", equals: "true", retry_s: 15}
  - screenshot: left-rail-extension
  - note: "MANUAL (reviewer, KVM window): hover the fixture bar widget, wait for the tooltip, confirm it opens to the right of the rail fully on-screen; activate the widget and confirm any popover is clamped inside the display; capture both frames into the bundle."
  - screenshot: left-rail-for-review
proof:
  - note: The active preset is the left-rail layout
    probe: {run: "horneroctl shell preset current", contains: hornero-left}
  - note: Exactly the left bar edge is visible
    probe: {run: "qs ipc call debug bars | jq -c '[.[] | select(.visible) | .edge] | unique'", equals: '["left"]', retry_s: 10}
  - note: A bar-placement fixture extension is loaded on this edge
    probe: {run: "qs ipc call plugins status | jq -r '[.plugins[] | select(.placement == \"bar\" and .state == \"loaded\")] | length >= 1'", equals: "true", retry_s: 10}
  - screenshot: final
media: [left-rail-extension]
budget: {wall_s: 120}
artifacts: {screenshots: always, logs: on-failure}
