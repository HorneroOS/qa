id: extensions/multimonitor-virtual
purpose: >-
  Multi-monitor, virtual outputs only (qa#81): on two differently scaled
  virtual outputs, per-screen bar and desktop extensions are instantiated
  on each display and stay loaded. This makes NO claim about physical
  monitors, hotplug, or disconnect fallback on real hardware - those stay
  NOT TESTED until an approved hardware fixture exists. PENDING until run
  in an approved KVM window.
covers: [qa#81, shell#222, shell#372]
requires: {outputs: 2, compositor: hyprland}
setup:
  layout: cockpit-clear
  commands:
    - >-
      hyprctl monitors all -j | jq -e '([.[] | select(.name == "Virtual-1")] | length == 1) and
      ([.[] | select(.name == "Virtual-2")] | length == 1)'
    - 'hyprctl keyword monitor "Virtual-1,1280x800@60,0x0,1"'
    - 'hyprctl keyword monitor "Virtual-2,1920x1080@60,1280x0,1.5"'
instruction: Start the desktop with two differently scaled virtual outputs and inspect the extensions on each screen.
steps:
  - probe: {run: "qs ipc call plugins status | jq -r .discovered", equals: "true", retry_s: 15}
  - screenshot: extensions-two-outputs
proof:
  - note: Hyprland reports Virtual-1 at scale 1 and Virtual-2 at scale 1.5
    probe: {run: "hyprctl monitors -j | jq -c '[.[] | {name,scale}] | sort_by(.name)'", equals: '[{"name":"Virtual-1","scale":1},{"name":"Virtual-2","scale":1.5}]', retry_s: 10}
  - note: Cockpit Clear has two visible bars on each output
    probe: {run: "qs ipc call debug bars | jq -c '[.[] | select(.visible)] | group_by(.screen) | map(length) | sort'", equals: '[2,2]', retry_s: 10}
  - note: Fixture extensions loaded with both outputs live, none failed
    probe: {run: "qs ipc call plugins status | jq -r '\"\\(.loaded >= 1) \\(.failed)\"'", equals: "true 0"}
  - screenshot: final
media: [extensions-two-outputs]
budget: {wall_s: 150}
artifacts: {screenshots: always, logs: on-failure}
