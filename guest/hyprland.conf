# Hornero QA session (test image only, never shipped).
#
# Product behaviour comes from the materialized HorneroOS/config fragments
# (environment, input, layout, window rules, keybindings), so scenarios drive
# the real product binds. Only determinism is overridden here: fixed outputs,
# no animations, no idle daemons, no autostart beyond the shell.

source = ~/.config/hypr/hyprland.conf.d/environment.conf
source = ~/.config/hypr/hyprland.conf.d/input.conf
source = ~/.config/hypr/hyprland.conf.d/layout.conf
source = ~/.config/hypr/hyprland.conf.d/window-rules.conf
source = ~/.config/hypr/hyprland.conf.d/keybindings.conf

# Outputs: one virtio-gpu head by default; extra heads stack to the right.
monitor = Virtual-1, 1280x800@60, 0x0, 1
monitor = Virtual-2, 1280x800@60, 1280x0, 1
monitor = , preferred, auto, 1

# QEMU has no NVIDIA VA-API: point libva at the virtio driver (an empty value is a config error).
env = LIBVA_DRIVER_NAME,virtio_gpu

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

cursor {
    no_hardware_cursors = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

exec-once = ~/.local/bin/qa-shell.sh
