id: experience/everyday-vs-signal
purpose: >-
  Experience pane (shell#478/#487): the pane lists the five modes, the user
  switches Everyday to Signal with the pointer, the service reports the new
  mode and its resolved profile differs from Everyday (glow, scanlines,
  instruments), and the desktop capture of each mode is kept so reviewers can
  judge whether Signal is visibly richer than Everyday (visual language §11).
  The proof asserts the contract; the visual-richness judgement is a human
  screenshot review and is recorded as such in the matrix.
covers: [shell#478, shell#487]
requires:
  resolution: 1280x800
  compositor: hyprland
setup:
  layout: cockpit
  commands:
    - qs ipc call experience set everyday
    - sleep 1
    - qs ipc call controlCenter open experience
instruction: In Settings, open Experience, switch from Everyday to Signal and compare the desktop.
steps:
  - probe: {run: "hyprctl clients -j | jq -r '[.[] | select(.title | startswith(\"Hornero Settings\")) | .title][0] // \"missing\"'", equals: "Hornero Settings - Experience", retry_s: 10}
  - wait: {stable: 1.5, timeout: 10}
  - screenshot: pane-everyday
  - pointer: {x: 0.8984, y: 0.7188, click: left}
  - probe: {run: "qs ipc call experience get", equals: signal, retry_s: 10}
  - wait: {stable: 2.0, timeout: 10}
  - screenshot: pane-signal
  - pointer: {x: 0.9328, y: 0.1288, click: left}
  - wait: {stable: 2.0, timeout: 10}
  - screenshot: desktop-signal
proof:
  - note: Five modes are offered
    probe: {run: "qs ipc call experience list | jq 'length'", equals: "5"}
  - note: Signal is active after the click
    probe: {run: "qs ipc call experience get", equals: signal}
  - note: Signal resolves glow, scanlines and instruments that Everyday does not
    probe:
      run: >-
        jq -nr --argjson s "$(qs ipc call experience profile signal)" --argjson e "$(qs ipc call experience profile everyday)"
        '[($s.fields.glow and ($e.fields.glow | not)), ($s.fields.scanlines and ($e.fields.scanlines | not)),
        ($s.fields.desktopWidgets == "instruments"), ($e.fields.desktopWidgets != "instruments")] | all'
      equals: "true"
  - note: Mode persisted to state
    probe: {run: "jq -r .mode \"$HOME/.local/state/hornero/experience.json\" 2>/dev/null || cat \"$HOME/.local/state/hornero/experience.json\"", contains: signal}
  - note: Shell alive, no QML errors
    probe: {run: "grep -Ec 'TypeError|ReferenceError|Cannot assign|QML.*Error' /tmp/qs.log || true", equals: "0"}
  - screenshot: final
media: [pane-everyday, pane-signal, desktop-signal]
budget: {wall_s: 150, max_actions: 24}
artifacts: {screenshots: always, logs: always}
