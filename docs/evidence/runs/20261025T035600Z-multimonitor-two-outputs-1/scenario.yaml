id: multimonitor/two-outputs
covers: [qa#25]
purpose: >-
  With two monitors the desktop comes up on both: Hyprland drives two
  outputs, the shell draws a bar on each, and the active layout applies to
  both screens.
requires: {outputs: 2, compositor: hyprland}
setup:
  layout: cockpit-clear
  commands:
    - >-
      hyprctl monitors all -j | jq -e '([.[] | select(.name == "Virtual-1")] | length == 1) and
      ([.[] | select(.name == "Virtual-2")] | length == 1)'
instruction: Start the desktop with two monitors connected and look at both screens.
proof:
  - note: Hyprland drives two outputs
    probe: {run: "hyprctl monitors -j | jq length", equals: "2", retry_s: 10}
  - note: Every output has the layout's bars (cockpit-clear has two per screen)
    probe:
      run: "qs ipc call debug bars | jq -c '[.[] | select(.visible)] | group_by(.screen) | map(length) | sort'"
      equals: '[2,2]'
      retry_s: 10
  - screenshot: both-screens
budget: {wall_s: 120}
artifacts: {screenshots: always, logs: on-failure}
