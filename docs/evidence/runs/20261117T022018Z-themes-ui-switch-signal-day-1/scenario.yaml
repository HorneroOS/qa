id: themes/ui-switch-signal-day
purpose: >-
  A keyboard user can find Hornero Signal Day through the launcher, apply it,
  and observe one coherent Shell, GTK, icon, and mode state.
instruction: >-
  Open the launcher, search for Hornero Signal Day, select it, and inspect the
  desktop. Do not use IPC or SSH to perform the theme change.
requires:
  resolution: 1280x800
steps:
  - key: ctrl+space
  - wait: {changed: true, stable: 0.4, timeout: 8}
  - probe:
      run: "qs ipc call drawers state launcher"
      equals: "true"
      retry_s: 3
  - type: ">theme Hornero Signal Day"
  - wait: {changed: true, stable: 0.5, timeout: 8}
  - screenshot: hornero-signal-day-result
  - key: enter
  - probe:
      run: "horneroctl appearance theme get"
      contains: "hornero-signal-day"
      retry_s: 20
  - screenshot: hornero-signal-day-applied
proof:
  - note: Hornero Signal Day is the active theme.
    probe: {run: "horneroctl appearance theme get", contains: "hornero-signal-day"}
  - note: Theme application resolved the light GTK color policy.
    probe: {run: "horneroctl --json appearance theme get | jq -er '.data.gtk_color_scheme'", equals: "prefer-light"}
  - note: The Shell appearance mode is light.
    probe: {run: "horneroctl --json appearance theme get | jq -er '.data.mode'", equals: "light"}
  - note: GTK uses the Hornero Signal Day pack.
    probe: {run: "horneroctl --json appearance theme get | jq -er '.data.gtk_theme'", equals: "Hornero-Signal-Day"}
  - note: Icons use the Hornero Signal Day pack.
    probe: {run: "horneroctl --json appearance theme get | jq -er '.data.icon_theme'", equals: "Papirus"}
  - note: Shell remains alive after the transaction.
    probe: {run: "pgrep -x qs || pgrep -x quickshell"}
  - screenshot: final
media: [hornero-signal-day-applied]
budget: {wall_s: 180, max_actions: 20}
artifacts: {screenshots: always, logs: on-failure}
