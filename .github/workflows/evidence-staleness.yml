name: Evidence staleness

# Weekly alarm for graphical-evidence freshness (docs/CADENCE.md, qa#17).
# Graphical lanes need an approved KVM window and cannot execute on
# hosted runners; this workflow only checks that the committed matrix
# is current and reports keep lanes whose tracked evidence is stale.
# A failing scheduled run is the alarm — refresh evidence, do not
# raise the threshold to silence it.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-staleness
  cancel-in-progress: false

jobs:
  staleness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Matrix is current
        run: uv run hornero-qa matrix --check
      - name: Staleness report (45 days)
        run: |
          set +e
          uv run hornero-qa matrix --stale-days 45 | tee /tmp/staleness.txt
          status=${PIPESTATUS[0]}
          {
            echo '## Evidence staleness (45 days)'
            echo '```'
            cat /tmp/staleness.txt
            echo '```'
            echo 'Cadence and quarantine policy: docs/CADENCE.md'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
